plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
    apply plugin: 'net.fabricmc.fabric-loom'

    version = "${mod_version}+${minecraft_version}"
    group = maven_group

    base {
        archivesName = "skyrpg-${project.name}"
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.encoding = 'UTF-8'
        options.deprecation = true
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    }

    // Projects with a mod_id (set in their own gradle.properties) are mods; :dev is not.
    if (project.hasProperty('mod_id')) {
        def modId = project.mod_id

        loom {
            splitEnvironmentSourceSets()
            mods {
                register(modId) {
                    sourceSet sourceSets.main
                    sourceSet sourceSets.client
                }
            }
        }

        processResources {
            def version = project.version
            inputs.property 'version', version
            filesMatching('fabric.mod.json') {
                expand 'version': version
            }
        }
    }
}
